[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "ammico"
dynamic = ["version"]
description = "AI Media and Misinformation Content Analysis Tool"
readme = "README.md"
maintainers = [
    { name = "Inga Ulusoy", email = "ssc@iwr.uni-heidelberg.de" },
    { name = "Dmitrii Kapitan", email = "ssc@iwr.uni-heidelberg.de" },
]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
 
dependencies = [
    "colorgram.py",
    "colour-science",
    "dash",
    "dash-bootstrap-components",
    "einops",
    "faiss-gpu-cu11<=1.13.0",
    "google-cloud-vision",
    "googletrans-py", # instead of googletrans4.0.0rc1, for a temporary solution due to incompatibility with jupyterlab
    "grpcio",
    "importlib_resources",
    "matplotlib", # without it, colour-science stubs matplotlib in sys.modules, which breaks transformers import
    "numpy",
    "opencv-python",
    "pandas",
    "pooch",
    "Pillow",
    "scipy",
    "spacy",
    "torch<2.9",
    "sentence-transformers<5.2",
    "timm",
    "torchvision",
    "transformers<4.58",
    "webcolors",
    "pip>=26.0.1", # spacy.cli.download installs the spacy model via pip, uv venvs ship without pip
]

[project.optional-dependencies]
api = [
    "openai>=1.0",
    "python-dotenv",
]

dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "psutil",
    "ruff",
    "mkdocs-material",
    "mkdocstrings[python]",
]

nb = [
    "datasets",
    "huggingface-hub",
    "ipython",
    "jupyter",
    "jupyter_dash",
]


[project.urls]
homepage = "https://github.com/ssciwr/AMMICO"  # FIXME not shown by pip
documentation = "https://ssciwr.github.io/AMMICO/build/html/index.html"

[tool.setuptools]
packages = ["ammico","ammico.data"]
# only ship the files listed in package-data, not every git-tracked file
include-package-data = false

# version is taken from the git tag (vX.Y.Z), see release workflow
[tool.setuptools_scm]

[tool.setuptools.package-data]
"ammico.data" = ["*.csv"]

[tool.ruff.lint]
ignore = [
    # BLE001 (catch blind `Exception`): this package processes user-supplied
    # image/video/audio batches through third-party and native tooling
    # (ffmpeg subprocesses, opencv, torch/CUDA, spacy, the openai SDK). A
    # single malformed input must not abort an entire batch job, so failures
    # around these external calls are deliberately caught broadly and
    # reported via `warnings.warn` with the original exception message,
    # rather than the batch crashing outright. Narrowing each catch to a
    # specific exception type would mean guessing at unstable third-party
    # exception hierarchies without real benefit.
    "BLE001",
]
